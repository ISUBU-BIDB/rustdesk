name: ISUBU Release

# ISUBU-BIDB derlemesini yayınlar. isubu-sync.yml tarafından isubu-<tag> dalında
# tetiklenir; elle de çalıştırılabilir (Run workflow -> dal seç -> tag gir).
#
# Release önce "prerelease" olarak oluşturulur. GitHub'ın /releases/latest yanıtı
# prerelease'leri içermez, bu yüzden panel (bidbdestek) yarım release'i görmez.
# Derleme işleri dosyaları release'e değil "isubu-release-*" artifact'larına yükler;
# hepsi başarılı olunca publish işi bunları release'e ekler, release'i "latest" yapar.
# Yalnızca indirme sayfasındaki platformlar derlenir: Windows x64 (exe+msi),
# macOS x64/arm64 (dmg), Linux x64 (AppImage, deb), Android arm64 (apk).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm (upstream tag, ör. 1.5.0)"
        required: true
        type: string
      publish_only:
        description: "Derlemeden sadece yayınla (bazı derlemeler başarısız olduysa, elle)"
        type: boolean
        default: false
      artifact_run_id:
        description: "publish_only ile: artifact'ların alınacağı başarılı run ID (boşsa bu run)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: isubu-release-${{ inputs.tag }}

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Check version and patches
        run: |
          # Varlık adları (rustdesk-<VERSION>-...) tag ile aynı olmalı; güncelleyici bu adı bekler
          grep -qE "^  VERSION: \"$TAG\"$" .github/workflows/flutter-build.yml \
            || { echo "flutter-build.yml VERSION '$TAG' değil"; exit 1; }
          bash isubu/patch.sh

      - name: Create prerelease
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG zaten var, varlıklar üzerine yüklenecek"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "RustDesk $TAG (ISUBU)" \
              --notes "Resmi RustDesk $TAG + ISUBU-BIDB ayarları (ID sunucusu: bidbdestek.isparta.edu.tr). İndirme: https://bidbdestek.isparta.edu.tr/"
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag }}

  publish:
    needs: build
    if: ${{ always() && (inputs.publish_only || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # 1.5.3+ istemci, güncellemeyi yalnızca rustdesk-update.json + .sig ile kabul eder.
      - name: Checkout metadata scripts
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install metadata dependencies
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        run: "python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt"

      # Checkout'tan SONRA indirilir; aksi halde çalışma alanı temizliği dist/'i siler.
      - name: Download build artifacts
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: isubu-release-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Show downloaded artifacts
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        run: find dist -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Sign update metadata
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
        run: |
          set -euo pipefail
          for f in rustdesk-${TAG}-x86_64.exe rustdesk-${TAG}-x86_64.msi \
                   rustdesk-${TAG}-x86_64.dmg rustdesk-${TAG}-aarch64.dmg; do
            test -f "dist/$f" || { echo "eksik varlık: dist/$f"; exit 1; }
          done
          python res/update/generate_update_metadata.py sign \
            --artifact windows x86_64 exe "dist/rustdesk-${TAG}-x86_64.exe" \
            --artifact windows x86_64 msi "dist/rustdesk-${TAG}-x86_64.msi" \
            --artifact macos x86_64 dmg "dist/rustdesk-${TAG}-x86_64.dmg" \
            --artifact macos aarch64 dmg "dist/rustdesk-${TAG}-aarch64.dmg" \
            --version "$TAG" --release-id "$TAG" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            --published-at "$(git log -1 --format=%cI)" \
            --metadata-out dist/rustdesk-update.json \
            --signature-out dist/rustdesk-update.json.sig

      - name: Verify update metadata
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        run: |
          set -euo pipefail
          set -a; . isubu/config.env; set +a
          export RUSTDESK_UPDATE_ED25519_PUBLIC_KEY="$ISUBU_UPDATE_PUBLIC_KEY_B64"
          python res/update/generate_update_metadata.py verify \
            --metadata dist/rustdesk-update.json \
            --signature dist/rustdesk-update.json.sig \
            --artifact "dist/rustdesk-${TAG}-x86_64.exe" \
            --artifact "dist/rustdesk-${TAG}-x86_64.msi" \
            --artifact "dist/rustdesk-${TAG}-x86_64.dmg" \
            --artifact "dist/rustdesk-${TAG}-aarch64.dmg" \
            --version "$TAG" --release-id "$TAG" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download"

      - name: Upload to release
        if: ${{ !inputs.publish_only || inputs.artifact_run_id != '' }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
